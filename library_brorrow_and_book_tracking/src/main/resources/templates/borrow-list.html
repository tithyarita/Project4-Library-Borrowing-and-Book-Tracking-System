<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library | Books</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- ===== HEADER ===== -->
<header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">📚 Library Books</h1>
        <a href="/user/dashboard"
           class="text-blue-600 hover:text-blue-800 font-medium">
            My Dashboard
        </a>
    </div>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main class="max-w-7xl mx-auto px-6 py-8">

    <!-- Search -->
    <form action="/books/search" method="get" class="mb-8">
        <div class="flex gap-3">
            <input type="text"
                   name="query"
                   placeholder="Search by title, author, category..."
                   class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
            <button type="submit"
                    class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                Search
            </button>
        </div>
    </form>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(books)}"
         class="text-center text-gray-500 py-16">
        No books found.
    </div>

    <!-- Book Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
         th:if="${!#lists.isEmpty(books)}">

        <div th:each="book : ${books}"
             class="bg-white rounded-xl shadow hover:shadow-lg transition p-4 flex flex-col">

            <!-- Book Cover -->
            <div class="h-48 bg-gray-100 rounded-lg flex items-center justify-center mb-4">
                <span class="text-gray-400 text-sm">No Cover</span>
            </div>

            <!-- Book Info -->
            <h3 class="text-lg font-semibold text-gray-800 mb-1"
                th:text="${book.title}">Book Title</h3>

            <p class="text-sm text-gray-600 mb-1">
                Author: <span th:text="${book.author}">Author</span>
            </p>

            <p class="text-sm text-gray-600 mb-3">
                Category: <span th:text="${book.category}">Category</span>
            </p>

            <!-- Availability -->
            <span th:if="${book.available}"
                  class="inline-block mb-3 text-sm font-medium text-green-600">
                Available
            </span>

            <span th:if="${!book.available}"
                  class="inline-block mb-3 text-sm font-medium text-red-600">
                Not Available
            </span>

            <!-- Action -->
            <div class="mt-auto">
                <a th:if="${book.available}"
                   th:href="@{/borrow/reserve/{id}(id=${book.id})}"
                   class="block text-center bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                    Book Now
                </a>

                <button th:if="${!book.available}"
                        disabled
                        class="block w-full bg-gray-300 text-gray-600 py-2 rounded-lg cursor-not-allowed">
                    Unavailable
                </button>
            </div>

        </div>
    </div>

</main>

<!-- ===== FOOTER ===== -->
<footer class="mt-12 py-6 text-center text-sm text-gray-500">
    © 2026 Library Borrowing System
</footer>

</body>
</html>
