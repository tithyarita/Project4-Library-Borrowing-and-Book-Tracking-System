<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Home Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-container">
      <!-- Logo goes to home -->
      <a href="/" class="logo">Library System</a>

      <!-- Navigation -->
      <nav class="main-nav">
        <a href="#home" class="active">Home</a>
        <a href="#featured">Featured</a>
        <a href="#categories">Categories</a>
      </nav>

      <!-- Icon Bar -->
      <div class="icon-bar">
        <!-- Search -->
        <a href="/search"><i class="ti ti-search"></i></a>

        <div class="icon-divider"></div>

        <!-- Account -->
        <a href="/account"><i class="ti ti-user"></i></a>

        <div class="icon-divider"></div>

        <!-- Optional: Remove dashboard if not used -->
        <!-- <a href="/dashboard"><i class="ti ti-books"></i></a> -->

        <!-- Logout -->
        <form th:action="@{/logout}" method="post" class="logout-form">
          <button type="submit" class="logout-btn">
            <i class="ti ti-logout logout-icon"></i>
            Logout
          </button>
        </form>
      </div>
    </div>
  </header>

  <!-- ===== HERO SECTION ===== -->
  <section id="home" class="hero-section">
    <div class="hero-container">
      <div class="hero-content">
        <h1>Explore & Borrow Books from Our Library</h1>
        <p>Access thousands of books — free to borrow for all members</p>
        <a href="/search" class="action-btn">Search Books →</a>
      </div>
      <div class="hero-image">
        <img src="https://img.freepik.com/premium-photo/school-library-with-shelves-overflowing-with-books_741910-47067.jpg" alt="Books" />
      </div>
    </div>
  </section>

  <!-- ===== FEATURED BOOKS & CATEGORIES ===== -->
  <!-- (Keep your sections as-is, just ensure borrow buttons point to /borrow/{id}) -->

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // ===== Active Navigation Highlighting =====
      const navLinks = document.querySelectorAll('.main-nav a[href^="#"]');
      const sections = document.querySelectorAll('section[id]');

      navLinks.forEach(link => {
        link.addEventListener('click', function () {
          navLinks.forEach(l => l.classList.remove('active'));
          this.classList.add('active');
        });
      });

      const activateSection = () => {
        let current = '';
        sections.forEach(section => {
          const sectionTop = section.offsetTop;
          const sectionHeight = section.clientHeight;
          if (window.scrollY >= sectionTop - 100 && window.scrollY < sectionTop + sectionHeight - 100) {
            current = section.getAttribute('id');
          }
        });

        navLinks.forEach(link => {
          link.classList.remove('active');
          if (link.getAttribute('href') === `#${current}`) {
            link.classList.add('active');
          }
        });
      };

      window.addEventListener('scroll', activateSection);
      activateSection();

      // ===== Borrow Buttons =====
      document.querySelectorAll(".borrow-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.bookId;
          if (confirm("Borrow this book?")) {
            window.location.href = "/borrow/" + id;
          }
        });
      });
    });
  </script>

  <!-- ===== CSS ===== -->
  <style>
    /* Keep all your existing styles; no changes needed for functionality */
  </style>

</body>
</html>
