<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <style>
        body { background:#f3f4f6; font-family:Arial; }
        .card { max-width:500px; margin:40px auto; background:white; padding:20px; border-radius:8px; }
        label { display:block; margin-top:12px; font-weight:bold; }
        input { width:100%; padding:8px; margin-top:5px; }
        button { margin-top:15px; background:#2563eb; color:white; padding:10px; border:none; width:100%; }
        a { display:block; margin-top:10px; text-align:center; color:#2563eb; }
    </style>
</head>
<body>

<div class="card">
    <h2>Edit Profile</h2>

    <form th:action="@{/user/account/edit}" method="post">
        <label>Full Name</label>
        <input type="text" name="fullName" th:value="${user.fullName}" required>

        <label>Email</label>
        <input type="email" name="email" th:value="${user.email}" required>

        <button type="submit">Save Changes</button>
    </form>

    <a href="/user/account">Cancel</a>
</div>

</body>
</html>
