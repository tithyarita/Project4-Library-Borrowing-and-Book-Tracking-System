<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Account Blacklisted</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<div class="max-w-md mx-auto mt-12 p-6 bg-white rounded-lg shadow-lg">
    <h1 class="text-2xl font-bold text-red-600">
        Account Blacklisted
    </h1>

    <p class="mt-4 text-gray-700">
        You have books overdue by more than 3 days.
        Your account is temporarily suspended.
    </p>

    <div class="mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-md">
        <p class="font-semibold text-yellow-800">Fine: $3.00</p>
        <p class="text-sm text-yellow-700">
            Pay to restore your borrowing privileges.
        </p>
    </div>

    <form th:action="@{/user/pay-fine}" method="post" class="mt-6">
        <button type="submit"
            class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-md font-semibold">
            Pay $3 Fine & Restore Account
        </button>
    </form>

    <a href="/user/borrowRecord"
       class="mt-4 block text-center text-blue-600 hover:underline">
        View Borrow Records
    </a>
</div>

</body>
</html>
