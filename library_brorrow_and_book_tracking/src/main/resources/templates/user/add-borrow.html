<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Borrow Record</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

<!-- Header -->
<header class="bg-blue-700 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold"><i class="fas fa-book-open mr-2"></i>Library System</h1>
        <button class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded font-semibold">Logout</button>
    </div>
</header>

<!-- Main content -->
<main class="flex-grow container mx-auto p-6 flex justify-center items-start">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Add Borrow Record</h2>

        <!-- Error Message -->
        <div th:if="${error}" class="bg-red-100 text-red-700 p-3 rounded mb-4 border border-red-300">
            <i class="fas fa-exclamation-circle mr-2"></i>
            <p th:text="${error}"></p>
        </div>

        <form th:action="@{/user/borrowRecord/add}" method="post" class="space-y-4" onsubmit="return validateForm();">
    <!-- Book Selection -->
    <div>
        <label class="block mb-1 font-medium text-gray-700">Book <span class="text-red-500">*</span></label>
        <select id="bookId" name="bookId"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- Select a book --</option>
            <option th:each="b : ${books}" th:value="${b.id}" th:text="${b.title}"></option>
        </select>
        <span id="bookError" class="text-red-500 text-sm hidden">Please select a book</span>
    </div>

    <!-- Submit Button -->
    <div class="text-center">
        <button type="submit"
                class="bg-blue-500 hover:bg-blue-600 text-white font-semibold px-6 py-2 rounded shadow-md transition duration-200">
            <i class="fas fa-plus mr-2"></i> Borrow
        </button>
    </div>
</form>

<script>
function validateForm() {
    const bookId = document.getElementById('bookId').value;
    const bookError = document.getElementById('bookError');
    
    if (!bookId || bookId === '') {
        bookError.classList.remove('hidden');
        return false;
    }
    bookError.classList.add('hidden');
    return true;
}
</script>

        <!-- Back Link -->
        <div class="mt-4 text-center">
            <a href="/user/borrowRecord" class="text-blue-500 hover:underline">Back to Borrow Records</a>
        </div>
    </div>
</main>
</body>
</html>
