<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle}">Library System</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body class="bg-gray-100 text-gray-800">

<!-- ===== HEADER ===== -->
<header class="bg-blue-600 text-white sticky top-0 z-50">
  <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
    <h1 class="text-xl font-bold flex items-center gap-2">
      <i class="fas fa-book-open"></i> Library System
    </h1>
    <div class="flex items-center gap-3">
      <span th:text="${userRole}"></span>
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm flex items-center gap-1">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </form>
    </div>
  </div>
</header>

<!-- ===== NAVIGATION ===== -->
<nav class="bg-white shadow-sm">
  <div class="max-w-6xl mx-auto flex gap-4 p-3">
    <a th:href="@{/librarian/manage_book}" 
       class="px-3 py-1 rounded hover:bg-gray-100" 
       th:classappend="${activeTab == 'manage_book'} ? 'border-b-2 border-blue-600 font-semibold'">Manage Books</a>
    <a th:href="@{/librarian/manage_user}" 
       class="px-3 py-1 rounded hover:bg-gray-100" 
       th:classappend="${activeTab == 'manage_user'} ? 'border-b-2 border-blue-600 font-semibold'">Manage Users</a>
    <a th:href="@{/librarian/process_return}" 
       class="px-3 py-1 rounded hover:bg-gray-100" 
       th:classappend="${activeTab == 'process_return'} ? 'border-b-2 border-blue-600 font-semibold'">Borrow / Return</a>
  </div>
</nav>

<!-- ===== MESSAGES ===== -->
<div class="max-w-6xl mx-auto mt-4 px-4">
  <div th:if="${successMessage}" class="bg-green-100 text-green-700 border border-green-300 rounded p-3 mb-2">
    <p th:text="${successMessage}"></p>
  </div>
  <div th:if="${errorMessage}" class="bg-red-100 text-red-700 border border-red-300 rounded p-3 mb-2">
    <p th:text="${errorMessage}"></p>
  </div>
</div>

<!-- ===== MAIN CONTENT ===== -->
<main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

  <!-- ===== PROCESS RETURN / BORROW RECORDS TABLE ===== -->
  <section class="bg-white rounded-xl shadow p-6">
    <h2 class="text-lg font-bold mb-4">
      <span th:text="${pageTitle}">Borrow Records</span>
    </h2>

    <!-- Optional search for librarian -->
    <div th:if="${userRole == 'LIBRARIAN'}" class="mb-4">
      <input type="text" placeholder="Enter ISBN, User ID, or Receipt ID" class="w-full p-2 border rounded"/>
    </div>

    <!-- Borrow Records Table -->
    <div th:if="${borrowRecord != null and not #lists.isEmpty(borrowRecord)}" class="overflow-x-auto">
      <table class="w-full border border-gray-200 rounded-md">
        <thead class="bg-gray-100 text-left text-gray-600 uppercase text-sm">
          <tr>
            <th class="p-2 border-b">ID</th>
            <th class="p-2 border-b">User</th>
            <th class="p-2 border-b">Book</th>
            <th class="p-2 border-b">Borrow Date</th>
            <th class="p-2 border-b">Due Date</th>
            <th class="p-2 border-b">Return Date</th>
            <th class="p-2 border-b">Status</th>
            <th class="p-2 border-b">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="record : ${borrowRecord}" class="hover:bg-gray-50">
            <td class="p-2 border-b" th:text="${record.id}"></td>
            <td class="p-2 border-b" th:text="${record.user.id} + ' - ' + record.user.name"></td>
            <td class="p-2 border-b" th:text="${record.book.id} + ' - ' + record.book.title"></td>
            <td class="p-2 border-b" th:text="${record.borrowDate}"></td>
            <td class="p-2 border-b" th:text="${record.dueDate}"></td>
            <td class="p-2 border-b" th:text="${record.returnDate} ?: '—'"></td>
            <td class="p-2 border-b">
              <span th:text="${record.status}" 
                    th:classappend="${record.status == 'LATE'} ? 'text-red-600 font-semibold' : ''"></span>
            </td>
            <td class="p-2 border-b flex gap-2">
              <!-- Librarian confirm return -->
              <form th:if="${userRole == 'LIBRARIAN' and record.status == 'BORROWED'}" 
                    th:action="@{/librarian/borrowRecord/{id}/confirmReturn(id=${record.id})}" method="post">
                <button class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-sm">Confirm</button>
              </form>

              <!-- User return button -->
              <form th:if="${userRole == 'USER' and record.status == 'BORROWED'}" 
                    th:action="@{/user/borrowRecord/{id}/return(id=${record.id})}" method="post">
                <button class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-sm">Return</button>
              </form>

              <!-- Delete button -->
              <form th:action="@{${userRole == 'LIBRARIAN'} ? '/librarian/borrowRecord/{id}/delete(id=${record.id})' : '/user/borrowRecord/{id}/delete(id=${record.id})'}" 
                    method="post" 
                    onsubmit="return confirm('Are you sure you want to delete this record?');">
                <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm">Delete</button>
              </form>

              <span th:if="${record.status == 'RETURNED'}" class="text-gray-500 text-sm">No actions</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div th:if="${borrowRecord == null or #lists.isEmpty(borrowRecord)}" class="text-center text-gray-500 italic p-4">
      No borrow records found.
    </div>
  </section>

  <!-- ===== QUICK ACTIONS ===== -->
  <section th:if="${userRole == 'LIBRARIAN'}" class="bg-white rounded-xl shadow p-6">
    <h2 class="text-lg font-bold mb-4">Quick Actions</h2>
    <div class="flex flex-col sm:flex-row gap-4">
      <a th:href="@{/librarian/manage_book}" class="flex-1 bg-blue-100 text-blue-700 border border-blue-300 rounded p-6 text-center hover:scale-105 transition">
        <i class="fas fa-book text-2xl mb-2"></i>
        <div class="font-semibold">Manage Books</div>
      </a>
      <a th:href="@{/librarian/manage_user}" class="flex-1 bg-green-100 text-green-700 border border-green-300 rounded p-6 text-center hover:scale-105 transition">
        <i class="fas fa-users text-2xl mb-2"></i>
        <div class="font-semibold">Manage Users</div>
      </a>
    </div>
  </section>

</main>
</body>
</html>
