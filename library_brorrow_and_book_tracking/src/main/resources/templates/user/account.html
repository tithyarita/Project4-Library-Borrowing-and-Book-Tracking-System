<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Account - Library System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
        }

        /* Header */
        header {
            background: #ffffff;
            border-bottom: 1px solid #ddd;
        }

        .header-container {
            max-width: 900px;
            margin: auto;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        /* Main */
        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .title h1 {
            margin: 0;
            color: #333;
        }

        .title p {
            color: #666;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 6px;
            padding: 20px;
            border: 1px solid #ddd;
        }

        .profile {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin-right: 15px;
        }

        .profile h2 {
            margin: 0;
        }

        .profile p {
            margin: 5px 0 0;
            color: #666;
        }

        /* Info Grid */
        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .info div p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        .info div strong {
            display: block;
            margin-top: 4px;
            color: #333;
        }

        /* Actions */
        .actions {
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .actions a {
            display: inline-block;
            margin-right: 10px;
            padding: 8px 14px;
            border-radius: 4px;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .edit {
            background: #2563eb;
        }

        .password {
            background: #6b7280;
        }

        .actions a:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header>
    <div class="header-container">
        <a href="/user/dashboard">Library System</a>
        <a href="/user/dashboard">← Back</a>
    </div>
</header>

<!-- MAIN -->
<main>

    <div class="title">
        <h1>My Account</h1>
        <p>Manage your personal information</p>
    </div>

    <div class="card">

        <!-- Profile -->
        <div class="profile">
            <div class="avatar">
                <span th:text="${#strings.substring(user.fullName,0,1)}">U</span>
            </div>
            <div>
                <h2 th:text="${user.fullName}">User Name</h2>
                <p th:text="${user.email}">user@email.com</p>
            </div>
        </div>

        <!-- Info -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">

        <!-- Full Name -->
        <div class="bg-gray-50 border rounded-lg p-4">
            <p class="text-sm text-gray-500 mb-1">Full Name</p>
            <p class="text-lg font-semibold text-gray-800"
            th:text="${user.fullName}">
                User Name
            </p>
        </div>

    <!-- Email -->
    <div class="bg-gray-50 border rounded-lg p-4">
        <p class="text-sm text-gray-500 mb-1">Email</p>
        <p class="text-lg font-semibold text-gray-800"
           th:text="${user.email}">
            user@email.com
        </p>
    </div>

    <!-- User ID -->
    <div class="bg-gray-50 border rounded-lg p-4">
        <p class="text-sm text-gray-500 mb-1">User ID</p>
        <p class="text-lg font-semibold text-gray-800"
           th:text="${user.id}">
            1
        </p>
    </div>

    <!-- Account Status -->
    <div class="bg-gray-50 border rounded-lg p-4">
        <p class="text-sm text-gray-500 mb-2">Account Status</p>
        <span class="inline-flex items-center gap-2
                     bg-green-100 text-green-700
                     px-3 py-1 rounded-full text-sm font-medium">
            ● Active
        </span>
    </div>

</div>



        <!-- Actions -->
        <div class="actions">
            <a href="/user/account/edit" class="edit">Edit Profile</a>
            <a href="/user/change_password" class="password">Change Password</a>
        </div>

    </div>
</main>

</body>
</html>
