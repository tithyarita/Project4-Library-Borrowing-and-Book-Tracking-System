<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="/css/change_password.css">
</head>
<body>

<div class="card">
    <h2>Change Password</h2>

    <form th:action="@{/user/change_password}" method="post" class="form">
        <label>Current Password</label>
        <input type="password" name="currentPassword" required>

        <label>New Password</label>
        <input type="password" name="newPassword" required>

        <button type="submit">Update Password</button>
    </form>

    <a th:href="@{/user/account}" class="back-link">Back</a>
</div>

</body>
</html>

<style>
    /* ===== Body ===== */
body {
    background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
    font-family: 'Inter', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

/* ===== Card ===== */
.card {
    background: #ffffff;
    padding: 2rem;
    border-radius: 1rem;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 450px;
    text-align: center;
}

/* ===== Heading ===== */
.card h2 {
    font-size: 1.75rem;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 1.5rem;
}

/* ===== Labels ===== */
label {
    display: block;
    margin-top: 1rem;
    margin-bottom: 0.25rem;
    font-weight: 600;
    color: #334155;
    text-align: left;
}

/* ===== Inputs ===== */
input[type="password"] {
    width: 27rem;
    padding: 0.75rem;
    border-radius: 0.5rem;
    border: 1px solid #cbd5e1;
    font-size: 1rem;
    transition: all 0.2s;
}

input[type="password"]:focus {
    outline: none;
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22,163,52,0.2);
}

/* ===== Button ===== */
button {
    margin-top: 1.5rem;
    width: 100%;
    padding: 0.75rem;
    background: linear-gradient(90deg, #16a34a, #15803d);
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    border: none;
    border-radius: 0.5rem;
    cursor: pointer;
    transition: all 0.2s;
}

button:hover {
    background: linear-gradient(90deg, #15803d, #166534);
    transform: translateY(-1px);
}

/* ===== Back Link ===== */
.back-link {
    display: block;
    margin-top: 1rem;
    font-weight: 500;
    color: #2563eb;
    text-decoration: none;
    transition: color 0.2s;
}

.back-link:hover {
    text-decoration: underline;
    color: #1e40af;
}

</style>
