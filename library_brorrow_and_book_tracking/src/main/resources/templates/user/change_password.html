<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <style>
        body { background:#f3f4f6; font-family:Arial; }
        .card { max-width:500px; margin:40px auto; background:white; padding:20px; border-radius:8px; }
        label { display:block; margin-top:12px; font-weight:bold; }
        input { width:100%; padding:8px; margin-top:5px; }
        button { margin-top:15px; background:#16a34a; color:white; padding:10px; border:none; width:100%; }
        a { display:block; margin-top:10px; text-align:center; color:#2563eb; }
    </style>
</head>
<body>

<div class="card">
    <h2>Change Password</h2>

    <form th:action="@{/user/change_password}" method="post">
        <label>Current Password</label>
        <input type="password" name="currentPassword" required>

        <label>New Password</label>
        <input type="password" name="newPassword" required>

        <button type="submit">Update Password</button>
    </form>

    <a href="/user/account">Back</a>
</div>

</body>
</html>
