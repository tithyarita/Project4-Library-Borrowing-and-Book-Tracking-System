<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library System Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>
<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-5 col-lg-4">
            <div class="login-card">

                <!-- Header -->
                <div class="login-header">
                    <h3>Library System Login</h3>
                </div>

                <div class="card-body mt-3">

                    <!-- Error -->
                    <div th:if="${param.error}" class="alert alert-danger text-center">
                        Invalid email or password.
                    </div>

                    <!-- Logout -->
                    <div th:if="${param.logout}" class="alert alert-info text-center">
                        You have been logged out successfully.
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/api/auth/login}" method="post">
                        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

                        <!-- Email -->
                        <div class="mb-3 input-group">
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="john@example.com"
                                   required>
                            <span class="input-group-text"><i class="fa-solid fa-book-open"></i></span>
                        </div>

                        <!-- Password -->
                        <div class="mb-3 input-group">
                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required>
                            <span class="input-group-text"><i class="fa-solid fa-book"></i></span>
                        </div>

                        <button type="submit" class="btn btn-login w-100 py-2 fw-semibold">
                            Login
                        </button>
                    </form>

                    <!-- Register Link -->
                    <p class="mt-3 text-center text-muted">
                        New user? 
                        <a th:href="@{/api/auth/register}" class="text-success fw-semibold">Register here</a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>


    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Floating Background Book */
        body::before {
            content: "";
            position: absolute;
            top: -50px;
            right: -50px;
            width: 600px;
            height: 600px;
            background: url('https://cdn-icons-png.flaticon.com/512/2920/2920222.png') no-repeat center center;
            background-size: contain;
            opacity: 0.05;
            animation: float 10s infinite alternate;
            z-index: 0;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .login-card {
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            padding: 2rem;
            position: relative;
            z-index: 1;
            background: white;
        }

        .login-header {
            background: #16a34a;
            border-radius: 12px 12px 0 0;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }

        .login-header h3 {
            margin: 0;
            font-weight: 600;
        }

        .form-control:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 0.2rem rgba(22,163,74,0.25);
        }

        .btn-login {
            background: #16a34a;
            border: none;
        }

        .btn-login:hover {
            background: #13803d;
        }

        .input-group-text {
            background: #e2f0e2;
            border: 1px solid #d1d5db;
            transition: transform 0.3s ease;
        }

        /* Animation: Bounce icon on focus */
        .form-control:focus + .input-group-text,
        .input-group:focus-within .input-group-text {
            transform: rotate(-15deg) scale(1.2);
        }

        .alert {
            font-size: 0.9rem;
        }

        a.text-success:hover {
            text-decoration: underline;
        }
    </style>
