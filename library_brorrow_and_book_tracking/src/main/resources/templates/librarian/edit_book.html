<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Book</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100">

<header class="bg-blue-700 text-white p-4 flex justify-between items-center">
  <h1 class="text-xl font-bold"><i class="fas fa-book-open"></i> Library System - Librarian</h1>
  <form th:action="@{/logout}" method="post">
    <button class="bg-red-600 px-4 py-2 rounded font-semibold">Logout</button>
  </form>
</header>

<main class="container mx-auto p-6">
  <nav class="flex gap-6 mb-6 border-b border-gray-300 pb-2">
    <a th:href="@{/librarian/manage-book}" class="text-blue-700 font-semibold border-b-2 border-blue-700">Manage Books</a>
    <a th:href="@{/librarian/manage-user}" class="text-gray-600 hover:text-blue-700">Manage Users</a>
    <a th:href="@{/librarian/process-return}" class="text-gray-600 hover:text-blue-700">Borrow / Return Logs</a>
  </nav>

  <section class="bg-white shadow rounded p-6">
    <h2 class="text-2xl font-bold mb-4">Edit Book</h2>

    <form th:action="@{/librarian/manage-book/update/{id}(id=${book.id})}" th:object="${book}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <div>
        <label>Title *</label>
        <input type="text" th:field="*{title}" required class="w-full border p-2 rounded">
      </div>

      <div>
        <label>Author *</label>
        <input type="text" th:field="*{author}" required class="w-full border p-2 rounded">
      </div>

      <div>
        <label>Category</label>
        <input type="text" th:field="*{category}" class="w-full border p-2 rounded">
      </div>

      <div>
        <label>ISBN</label>
        <input type="text" th:field="*{isbn}" class="w-full border p-2 rounded">
      </div>

      <div>
        <label>Publisher</label>
        <input type="text" th:field="*{publisher}" class="w-full border p-2 rounded">
      </div>

      <div>
        <label>Publish Year</label>
        <input type="number" th:field="*{publishYear}" class="w-full border p-2 rounded">
      </div>
      

      <div>
        <label>Cover URL</label>
        <input type="text" th:field="*{coverUrl}" class="w-full border p-2 rounded">
      </div>

      <div class="flex items-center">
        <input type="checkbox" th:field="*{available}" id="available" class="mr-2">
        <label for="available">Available</label>
      </div>

      <div class="md:col-span-2 mt-2">
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Update Book</button>
        <a th:href="@{/librarian/manage-book}" class="ml-4 bg-gray-300 px-4 py-2 rounded">Cancel</a>
      </div>

    </form>
  </section>
</main>
</body>
</html>
