<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Borrow History</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-100 min-h-screen">

<!-- ================= HEADER ================= -->
<header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
        <h1 class="text-xl font-bold text-blue-600">
            <i class="fas fa-book-open mr-1"></i> Library System
        </h1>
        <a href="/librarian/manage_user"
           class="text-sm text-gray-600 hover:text-blue-600">
            ← Back to Users
        </a>
    </div>
</header>

<!-- ================= MAIN ================= -->
<main class="max-w-6xl mx-auto p-6">

    <!-- User Info -->
    <section class="bg-white shadow rounded p-6 mb-6 flex items-center gap-4">
        <div class="text-blue-600 text-4xl">
            <i class="fas fa-user-circle"></i>
        </div>
        <div>
            <h2 class="text-xl font-bold text-gray-800"
                th:text="${user.fullName}">
                User Name
            </h2>
            <p class="text-gray-500 text-sm"
               th:text="${user.email}">
                user@email.com
            </p>
        </div>
    </section>

    <!-- Borrow History -->
    <section class="bg-white shadow rounded p-6">

        <h3 class="text-lg font-semibold text-gray-700 mb-4">
            <i class="fas fa-history mr-1"></i> Borrow History
        </h3>

        <div class="overflow-x-auto">
            <table class="w-full border-collapse">
                <thead class="bg-gray-50 text-sm text-gray-600">
                    <tr>
                        <th class="p-3 border text-left">Book</th>
                        <th class="p-3 border">Borrow Date</th>
                        <th class="p-3 border">Due Date</th>
                        <th class="p-3 border">Return Date</th>
                        <th class="p-3 border">Status</th>
                    </tr>
                </thead>

                <tbody class="text-sm">
                    <tr th:each="r : ${history}"
                        class="hover:bg-gray-50 transition">

                        <td class="p-3 border font-semibold text-gray-800"
                            th:text="${r.book.title}">
                            Book Title
                        </td>

                        <td class="p-3 border text-center"
                            th:text="${r.borrowDate}">
                        </td>

                        <td class="p-3 border text-center"
                            th:text="${r.dueDate}">
                        </td>

                        <td class="p-3 border text-center"
                            th:text="${r.returnDate != null ? r.returnDate : '—'}">
                        </td>

                        <td class="p-3 border text-center">
                            <span th:if="${r.returnDate != null}"
                                  class="px-3 py-1 rounded-full bg-green-100 text-green-700 font-semibold text-xs">
                                Returned
                            </span>

                            <span th:if="${r.returnDate == null}"
                                  class="px-3 py-1 rounded-full bg-red-100 text-red-700 font-semibold text-xs">
                                Not Returned
                            </span>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(history)}">
                        <td colspan="5"
                            class="text-center text-gray-500 p-6 italic">
                            No borrowing history found for this user.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </section>

</main>

</body>
</html>
