<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Librarian Dashboard - Library System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
        <a href="/librarian/dashboard" class="text-blue-600 font-bold text-xl">Library System (Librarian)</a>
        <div class="flex items-center gap-4">
            <a href="/librarian/manage_book" class="text-gray-700 hover:text-blue-600">Manage Books</a>
            <a href="/librarian/manage_user" class="text-gray-700 hover:text-blue-600">Manage Users</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">Logout</button>
            </form>
        </div>
    </div>
</header>

<main class="max-w-6xl mx-auto p-6">
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-800">Welcome, <span th:text="${user.fullName} ?: 'Librarian'">Librarian</span></h1>
        <p class="text-gray-600">Overview of library status.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
        <div class="bg-white shadow rounded p-4">
            <p class="text-gray-500 text-sm">Total Books</p>
            <p class="font-bold text-xl" th:text="${totalBooks} ?: 0">0</p>
        </div>
        <div class="bg-white shadow rounded p-4">
            <p class="text-gray-500 text-sm">Pending Borrow Requests</p>
            <p class="font-bold text-xl" th:text="${pendingBorrowRequests} ?: 0">0</p>
        </div>
        <div class="bg-white shadow rounded p-4">
            <p class="text-gray-500 text-sm">Overdue Books</p>
            <p class="font-bold text-xl" th:text="${overdueBooks} ?: 0">0</p>
        </div>
    </div>

    <div class="bg-white shadow rounded p-4">
        <h3 class="font-semibold text-gray-700 mb-4">Recent Overdue</h3>
        <div th:if="${#lists.isEmpty(overdueList)}" class="text-gray-400 italic">No overdue items.</div>
        <div th:each="b : ${overdueList}" class="mb-3 border-b border-gray-200 pb-2">
            <p class="font-semibold" th:text="${b.book.title}">Book Title</p>
            <p class="text-sm text-gray-500" th:text="'Borrower: ' + ${b.user.fullName}">Borrower</p>
            <p class="text-sm text-gray-500" th:text="'Due: ' + ${#dates.format(b.dueDate, 'dd MMM yyyy')}">Due date</p>
        </div>
    </div>

</main>

</body>
</html>
