<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Librarian Dashboard - Library System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- ================= HEADER ================= -->
<header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
        <a href="/librarian/dashboard" class="text-blue-600 font-bold text-xl hover:text-blue-700">Library System (Librarian)</a>
        <div class="flex items-center gap-4">
            <a href="/books" class="text-gray-700 hover:text-blue-600 px-3 py-1 rounded hover:bg-gray-100">Manage Books</a>
            <a href="/librarian/manage_user" class="text-gray-700 hover:text-blue-600 px-3 py-1 rounded hover:bg-gray-100">Manage Users</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">Logout</button>
            </form>
        </div>
    </div>
</header>

<!-- ================= MAIN ================= -->
<main class="max-w-7xl mx-auto p-6">

    <!-- Welcome -->
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-800">
            Welcome, <span th:text="${user.fullName} ?: 'Librarian'">Librarian</span>!
        </h1>
        <p class="text-gray-600 mt-1">Here's an overview of the library status.</p>
    </div>

    <!-- Dashboard Stats -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
        <div class="bg-white shadow rounded p-6 flex items-center gap-4 hover:shadow-lg transition">
            <div class="text-blue-600 text-4xl">📚</div>
            <div>
                <p class="text-gray-500 text-sm">Total Books</p>
                <p class="font-bold text-2xl" th:text="${totalBooks} ?: 0">0</p>
            </div>
        </div>

        <div class="bg-white shadow rounded p-6 flex items-center gap-4 hover:shadow-lg transition">
            <div class="text-yellow-500 text-4xl">⏳</div>
            <div>
                <p class="text-gray-500 text-sm">Pending Borrow Requests</p>
                <p class="font-bold text-2xl" th:text="${pendingBorrowRequests} ?: 0">0</p>
            </div>
        </div>

        <div class="bg-white shadow rounded p-6 flex items-center gap-4 hover:shadow-lg transition">
            <div class="text-red-500 text-4xl">⚠️</div>
            <div>
                <p class="text-gray-500 text-sm">Overdue Books</p>
                <p class="font-bold text-2xl" th:text="${overdueBooks} ?: 0">0</p>
            </div>
        </div>
    </div>

    <!-- Recent Overdue -->
    <div class="bg-white shadow rounded p-6">
        <h3 class="font-semibold text-gray-700 mb-4 text-lg">Recent Overdue</h3>

        <div th:if="${#lists.isEmpty(overdueList)}" class="text-gray-400 italic">
            No overdue items.
        </div>

        <div th:each="b : ${overdueList}" class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4 border-b border-gray-200 pb-2 last:border-none last:pb-0 hover:bg-gray-50 transition p-2 rounded">
            <div>
                <p class="font-bold text-gray-800" th:text="${b.book.title}">Book Title</p>
                <p class="text-sm text-gray-500" th:text="'Borrower: ' + ${b.user.fullName}">Borrower</p>
                <p class="text-sm text-gray-500" th:text="'Due: ' + ${#dates.format(b.dueDate, 'dd MMM yyyy')}">Due date</p>
            </div>
            <div>
                <!-- Optional action buttons -->
                <a th:href="@{/librarian/confirm/{id}(id=${b.id})}" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">Confirm</a>
            </div>
        </div>
    </div>

</main>

</body>
</html>
