<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Librarian - Manage Books</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100">

<!-- Header -->
<header class="bg-blue-700 text-white shadow p-4 flex justify-between items-center">
  <h1 class="text-xl font-bold"><i class="fas fa-book-open"></i> Library System - Librarian</h1>
  <form th:action="@{/logout}" method="post">
    <button class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-semibold">Logout</button>
  </form>
</header>

<main class="container mx-auto p-6">
  <!-- Tabs -->
  <nav class="flex gap-6 mb-6 border-b border-gray-300 pb-2">
    <a th:href="@{/librarian/manage-book}" class="text-blue-700 font-semibold border-b-2 border-blue-700">Manage Books</a>
    <a th:href="@{/librarian/manage-user}" class="text-gray-600 hover:text-blue-700">Manage Users</a>
    <a th:href="@{/librarian/process-return}" class="text-gray-600 hover:text-blue-700">Borrow / Return Logs</a>
  </nav>

  <!-- Add Book Form -->
  <section class="bg-white shadow rounded p-6 mb-6">
    <h2 class="text-2xl font-bold mb-4">Add New Book</h2>
    <form th:action="@{/librarian/manage-book/add}" method="post" th:object="${book}" class="grid grid-cols-1 md:grid-cols-5 gap-2">
      <input type="text" th:field="*{title}" placeholder="Title *" required class="border border-gray-300 rounded px-2 py-1">
      <input type="text" th:field="*{author}" placeholder="Author *" required class="border border-gray-300 rounded px-2 py-1">
      <input type="text" th:field="*{category}" placeholder="Category" class="border border-gray-300 rounded px-2 py-1">
      <input type="text" th:field="*{isbn}" placeholder="ISBN" class="border border-gray-300 rounded px-2 py-1">
      <input type="text" th:field="*{coverUrl}" placeholder="Cover URL" class="border border-gray-300 rounded px-2 py-1">
      <button type="submit" class="md:col-span-5 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-semibold mt-2">
        <i class="fas fa-plus mr-2"></i> Add Book
      </button>
    </form>
  </section>

  <!-- Book Table -->
  <section class="bg-white shadow rounded p-6">
    <h2 class="text-2xl font-bold mb-4">Book Inventory</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full border border-gray-200">
        <thead class="bg-gray-100">
          <tr>
            <th class="px-4 py-2 border">Title</th>
            <th class="px-4 py-2 border">Author</th>
            <th class="px-4 py-2 border">ISBN</th>
            <th class="px-4 py-2 border">Status</th>
            <th class="px-4 py-2 border">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="book : ${books}" class="hover:bg-gray-50">
            <td class="px-4 py-2 border" th:text="${book.title}">Title</td>
            <td class="px-4 py-2 border" th:text="${book.author}">Author</td>
            <td class="px-4 py-2 border" th:text="${book.isbn}">ISBN</td>
            <td class="px-4 py-2 border">
              <span th:class="${book.available ? 'bg-green-100 text-green-800 px-2 py-1 rounded-full text-sm font-semibold' : 'bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full text-sm font-semibold'}"
                    th:text="${book.available ? 'Available' : 'Borrowed'}"></span>
            </td>
            <td class="px-4 py-2 border">
              <a th:href="@{'/librarian/manage-book/edit/' + ${book.id}}" 
                 class="text-blue-600 hover:text-blue-800 mr-2"><i class="fas fa-edit"></i> Edit</a>
              <a th:href="@{'/librarian/manage-book/delete/' + ${book.id}}" 
                 class="text-red-600 hover:text-red-800" 
                 onclick="return confirm('Are you sure you want to delete this book?');"><i class="fas fa-trash"></i> Delete</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

</body>
</html>
