<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

<main class="container mx-auto p-6">
    <h2 class="text-2xl mb-4">Edit User</h2>

    <form th:action="@{/librarian/edit-user/{id}(id=${user.id})}" th:object="${user}" method="post" class="space-y-4">
        <div>
            <label class="block mb-1">Full Name</label>
            <input type="text" th:field="*{fullName}" class="border rounded p-2 w-full"/>
        </div>

        <div>
            <label class="block mb-1">Email</label>
            <input type="email" th:field="*{email}" class="border rounded p-2 w-full"/>
        </div>

        <div>
            <label class="block mb-1">Active</label>
            <select th:field="*{active}" class="border rounded p-2 w-full">
                <option th:value="true" th:text="'Active'"></option>
                <option th:value="false" th:text="'Inactive'"></option>
            </select>
        </div>

        <div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Save Changes</button>
            <a th:href="@{/librarian/manage-user}" class="bg-gray-400 text-white px-4 py-2 rounded">Cancel</a>
        </div>
    </form>
</main>

</body>
</html>
