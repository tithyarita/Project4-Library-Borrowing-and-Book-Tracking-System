<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add User</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

<main class="container mx-auto p-6">
    <h2 class="text-2xl mb-4">Add New User</h2>

    <form th:action="@{/librarian/add-user}" th:object="${user}" method="post" class="space-y-4">
        <div>
            <label class="block mb-1">Full Name</label>
            <input type="text" th:field="*{fullName}" class="border rounded p-2 w-full" required/>
        </div>

        <div>
            <label class="block mb-1">Email</label>
            <input type="email" th:field="*{email}" class="border rounded p-2 w-full" required/>
        </div>
        <div>
            <label class="block mb-1">Password</label>
            <input type="password" th:field="*{password}" class="border rounded p-2 w-full" required/>
        </div>


        <div>
            <label class="block mb-1">Active</label>
            <select th:field="*{active}" class="border rounded p-2 w-full">
                <option th:value="true">Active</option>
                <option th:value="false">Inactive</option>
            </select>
        </div>

        <div class="flex gap-2">
            <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Add User</button>
            <a th:href="@{/librarian/manage_user}" class="bg-gray-400 text-white px-4 py-2 rounded">Cancel</a>
        </div>
    </form>
</main>

</body>
</html>
