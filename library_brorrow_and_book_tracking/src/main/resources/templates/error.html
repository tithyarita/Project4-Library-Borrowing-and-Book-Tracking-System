<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-red-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-2xl p-8 max-w-2xl w-full">
        <div class="flex items-center justify-center mb-4">
            <i class="fas fa-exclamation-triangle text-red-600 text-4xl"></i>
        </div>
        
        <h1 class="text-3xl font-bold text-red-600 text-center mb-4">Oops! An Error Occurred</h1>
        
        <div class="bg-red-100 border border-red-300 rounded p-4 mb-6">
            <p class="text-red-700 font-semibold mb-2">Error Details:</p>
            <p class="text-red-600" th:text="${error}"></p>
        </div>
        
        <div th:if="${details}" class="bg-gray-100 border border-gray-300 rounded p-4 mb-6 max-h-64 overflow-y-auto">
            <p class="text-gray-700 font-semibold mb-2">Stack Trace:</p>
            <pre class="text-gray-600 text-xs" th:text="${details}"></pre>
        </div>
        
        <div class="flex gap-4 justify-center">
            <a href="/user/borrowRecord" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded font-semibold">
                <i class="fas fa-arrow-left mr-2"></i> Back to Records
            </a>
            <a href="/user/home" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded font-semibold">
                <i class="fas fa-home mr-2"></i> Go Home
            </a>
        </div>
    </div>
</body>
</html>
