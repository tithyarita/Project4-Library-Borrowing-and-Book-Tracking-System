<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Librarian - Manage Books</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f8;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>

<body class="bg-gray-100">

<header class="bg-blue-700 text-white shadow p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">
        <i class="fas fa-book-open"></i> Library System - Librarian
    </h1>

    <form th:action="@{/logout}" method="post">
        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />
        <button class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-semibold">
            Logout
        </button>
    </form>
</header>

<main class="container mx-auto p-6">

    <!-- Tabs -->
    <nav class="flex gap-6 mb-6 border-b border-gray-300 pb-2">
        <a th:href="@{/librarian/manage-book}"
           class="text-blue-700 font-semibold border-b-2 border-blue-700">
            Manage Books
        </a>
        <a th:href="@{/librarian/manage-user}" class="text-gray-600 hover:text-blue-700">
            Manage Users
        </a>
        <a th:href="@{/librarian/process-return}" class="text-gray-600 hover:text-blue-700">
            Borrow / Return Logs
        </a>
    </nav>

    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">Book List</h2>
        <a th:href="@{/books/add}"
           class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-semibold">
            <i class="fas fa-plus mr-2"></i> Add New Book
        </a>
    </div>

    <!-- Books Table -->
    <div class="overflow-x-auto">
        <table class="min-w-full bg-white shadow rounded-lg overflow-hidden">

            <thead class="bg-blue-600 text-white">
            <tr>
                <th class="py-2 px-4 text-left">Cover</th>
                <th class="py-2 px-4 text-left">Title</th>
                <th class="py-2 px-4 text-left">Author</th>
                <th class="py-2 px-4 text-left">ISBN</th>
                <th class="py-2 px-4 text-left">Publisher</th>
                <th class="py-2 px-4 text-left">Year</th>
                <th class="py-2 px-4 text-left">Category</th>
                <th class="py-2 px-4 text-left">Available</th>
                <th class="py-2 px-4 text-left">Created At</th>
                <th class="py-2 px-4 text-left">Updated At</th>
                <th class="py-2 px-4 text-left">Actions</th>
            </tr>
            </thead>

            <tbody>

            <!-- No books -->
            <tr th:if="${books == null || books.isEmpty()}">
                <td colspan="11" class="text-center py-4 text-gray-500">
                    No books found
                </td>
            </tr>

            <!-- Book rows -->
            <tr th:each="book : ${books}" class="border-b hover:bg-gray-50">

                <!-- Cover -->
                <td class="py-2 px-4">
                    <img th:if="${book.coverUrl != null}"
                         th:src="@{${book.coverUrl}}"
                         alt="Book Cover"
                         class="w-16 h-20 object-cover rounded shadow">

                    <img th:unless="${book.coverUrl != null}"
                         th:src="@{/images/default-book.png}"
                         alt="Default Cover"
                         class="w-16 h-20 object-cover rounded shadow">
                </td>

                <td class="py-2 px-4" th:text="${book.title}">Title</td>
                <td class="py-2 px-4" th:text="${book.author}">Author</td>
                <td class="py-2 px-4" th:text="${book.isbn}">ISBN</td>
                <td class="py-2 px-4" th:text="${book.publisher}">Publisher</td>
                <td class="py-2 px-4" th:text="${book.publishYear}">Year</td>
                <td class="py-2 px-4" th:text="${book.category}">Category</td>

                <td class="py-2 px-4"
                    th:text="${book.available} ? 'Yes' : 'No'">
                    Available
                </td>

                <td class="py-2 px-4"
                    th:text="${book.createdAt != null
                        ? #temporals.format(book.createdAt, 'yyyy-MM-dd HH:mm')
                        : 'N/A'}">
                    Created At
                </td>

                <td class="py-2 px-4"
                    th:text="${book.updatedAt != null
                        ? #temporals.format(book.updatedAt, 'yyyy-MM-dd HH:mm')
                        : 'N/A'}">
                    Updated At
                </td>

                <!-- Actions -->
                <td class="py-2 px-4 flex gap-3">
                    <a th:href="@{/books/edit/{id}(id=${book.id})}"
                       class="text-blue-600 hover:underline">
                        <i class="fas fa-edit"></i> Edit
                    </a>

                    <form th:action="@{/books/delete/{id}(id=${book.id})}"
                          method="post"
                          style="display:inline;">
                        <input type="hidden"
                               th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />
                        <button type="submit"
                                class="text-red-600 hover:underline bg-transparent border-none cursor-pointer"
                                onclick="return confirm('Are you sure you want to delete this book?')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </form>
                </td>
            </tr>

            </tbody>
        </table>
    </div>

</main>

</body>
</html>
