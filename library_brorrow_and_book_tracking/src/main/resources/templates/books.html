<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Librarian - Manage Books</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

<!-- ================= HEADER ================= -->
<header class="bg-blue-700 text-white shadow">
    <div class="w-full max-w-[1600px] mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">
            <i class="fas fa-book-open mr-2"></i> Library System – Librarian
        </h1>

        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <button class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded font-semibold">
                Logout
            </button>
        </form>
    </div>
</header>

<!-- ================= TABS ================= -->
<nav class="bg-white border-b">
    <div class="w-full max-w-[1600px] mx-auto px-6 flex gap-6 py-3">
        <a th:href="@{/librarian/dashboard}" class="tab">Dashboard</a>
        <a th:href="@{/librarian/books}" class="tab active">Manage Books</a>
        <a th:href="@{/librarian/manage_user}" class="tab">Manage Users</a>
        <a th:href="@{/librarian/manage-borrows}" class="tab">Manage Borrows</a>
        <a th:href="@{/librarian/records}" class="tab">Borrow / Return Logs</a>
    </div>
</nav>

<!-- ================= MAIN ================= -->
<main class="flex-1 w-full px-6 py-6">

    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-gray-800">Book List</h2>

        <a th:href="@{/books/add}"
           class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-semibold">
            <i class="fas fa-plus mr-2"></i> Add New Book
        </a>
    </div>

    <!-- Messages -->
    <div th:if="${message}" class="mb-4 p-3 bg-green-100 text-green-800 rounded">
        <span th:text="${message}"></span>
    </div>

    <div th:if="${error}" class="mb-4 p-3 bg-red-100 text-red-800 rounded">
        <span th:text="${error}"></span>
    </div>

    <!-- ================= TABLE ================= -->
    <div class="bg-white shadow rounded-lg w-full overflow-hidden">

        <table class="w-full table-fixed border-collapse">

            <thead class="bg-blue-600 text-white text-sm">
            <tr>
                <th class="px-2 py-2 w-[60px]">#</th>
                <th class="px-2 py-2 w-[80px]">Cover</th>
                <th class="px-2 py-2 w-[160px]">Title</th>
                <th class="px-2 py-2 w-[120px]">Author</th>
                <th class="px-2 py-2 w-[130px]">ISBN</th>
                <th class="px-2 py-2 w-[120px]">Publisher</th>
                <th class="px-2 py-2 w-[80px]">Year</th>
                <th class="px-2 py-2 w-[120px]">Category</th>
                <th class="px-2 py-2 w-[80px]">Qty</th>
                <th class="px-2 py-2 w-[90px]">Available</th>
                <th class="px-2 py-2 w-[110px]">Created</th>
                <th class="px-2 py-2 w-[120px]">Actions</th>
            </tr>
            </thead>

            <tbody class="text-sm">

            <!-- No books -->
            <tr th:if="${books == null || books.isEmpty()}">
                <td colspan="12" class="text-center py-6 text-gray-500">
                    No books found
                </td>
            </tr>

            <!-- Book rows -->
            <tr th:each="book, stat : ${books}" class="border-b hover:bg-gray-50">

                <!-- Row number -->
                <td class="px-2 py-2 text-center font-semibold"
                    th:text="${stat.count}">
                </td>

                <!-- Cover -->
                <td class="px-2 py-2">
                    <img th:src="${book.coverUrl != null ? book.coverUrl : '/images/default-book.png'}"
                         class="w-12 h-16 object-cover rounded shadow">
                </td>

                <td class="px-2 py-2 truncate" th:text="${book.title}"></td>
                <td class="px-2 py-2 truncate" th:text="${book.author}"></td>
                <td class="px-2 py-2 truncate" th:text="${book.isbn}"></td>
                <td class="px-2 py-2 truncate" th:text="${book.publisher}"></td>
                <td class="px-2 py-2 text-center" th:text="${book.publishYear}"></td>
                <td class="px-2 py-2 truncate" th:text="${book.category}"></td>
                <td class="px-2 py-2 text-center" th:text="${book.quantity}"></td>

                <td class="px-2 py-2 text-center font-semibold"
                    th:text="${book.available ? 'Yes' : 'No'}">
                </td>

                <td class="px-2 py-2 text-xs text-center"
                    th:text="${#temporals.format(book.createdAt,'yyyy-MM-dd')}">
                </td>

                <!-- Actions -->
                <td class="px-2 py-2">
                    <div class="flex gap-2 justify-center">
                        <a th:href="@{/books/edit/{id}(id=${book.id})}"
                           class="text-blue-600 hover:text-blue-800">
                            <i class="fas fa-edit"></i>
                        </a>

                        <form th:action="@{/books/delete/{id}(id=${book.id})}"
                              method="post">
                            <input type="hidden"
                                   th:if="${_csrf != null}"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}" />
                            <button type="submit"
                                    class="text-red-600 hover:text-red-800"
                                    onclick="return confirm('Delete this book?')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>

            </tbody>
        </table>
    </div>

</main>

<!-- ================= TAB STYLE ================= -->
<style>
    .tab {
        padding-bottom: 0.5rem;
        color: #6b7280;
        text-decoration: none;
        font-weight: 500;
    }
    .tab.active {
        border-bottom: 2px solid #2563eb;
        color: #2563eb;
        font-weight: 600;
    }
</style>

</body>
</html>
