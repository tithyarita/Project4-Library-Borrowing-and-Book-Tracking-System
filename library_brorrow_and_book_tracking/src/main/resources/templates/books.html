<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available Books</title>
</head>
<body>

<h2>Available Books</h2>

<p th:text="'Number of books: ' + (${books} != null ? ${books.size()} : 0)"></p>

<table border="1" cellpadding="5" cellspacing="0">
    <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>ISBN</th>
            <th>Available</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>
        <tr th:if="${books == null || books.isEmpty()}">
            <td colspan="5" style="text-align:center;">No books available</td>
        </tr>

        <tr th:each="book : ${books}">
            <td th:text="${book.title}">Title</td>
            <td th:text="${book.author}">Author</td>
            <td th:text="${book.isbn}">ISBN</td>
            <td th:text="${book.available} ? 'Yes' : 'No'">Available</td>
            <td>
                <span th:if="${book.available}">
                    <a th:href="@{/user/borrow/{id}(id=${book.id})}">Borrow</a>
                </span>
                <span th:if="${!book.available}">
                    Not Available
                </span>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
