 <!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body class="bg-slate-50 text-slate-800 antialiased">

<!-- ================= HEADER ================= -->
<header class="site-header">
    <div class="header-container">
        <a th:href="@{/user/home}" class="logo">Library System</a>

        <nav class="hidden md:flex items-center gap-8">
            <a href="#featured" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition">Featured</a>
            <a href="#categories" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition">Categories</a>
        </nav>

        <div class="icon-bar">
            <a th:href="@{/user/search}"><i class="ti ti-search"></i></a>
            <div class="icon-divider"></div>
            <a th:href="@{/user/dashboard}"><i class="ti ti-books"></i></a>
            <div class="icon-divider"></div>
            <a th:href="@{/user/account}"><i class="ti ti-user"></i></a>
            <div class="icon-divider"></div>

            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="logout-btn">
                    Logout
                </button>
            </form>
        </div>
    </div>
</header>

<!-- ================= HERO ================= -->
<section class="bg-gradient-to-r from-blue-50 to-white py-16">
    <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-10 items-center px-6">
        <div>
            <h1 class="text-4xl md:text-5xl font-bold leading-tight mb-4">Discover, Borrow, and Learn</h1>
            <p class="text-lg text-slate-600 mb-6 max-w-md">
                Explore thousands of books and manage your reading digitally.
            </p>
            <a href="/user/search"
               class="inline-flex items-center px-5 py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-full hover:bg-blue-700 transition">
                Search Books →
            </a>
        </div>
        <div class="hidden md:block">
            <img src="https://i.pinimg.com/1200x/9f/c0/07/9fc007618a90b1975e2c601458e33a07.jpg"
                 alt="Library"
                 class="rounded-2xl shadow-md w-full h-56 object-cover">
        </div>
    </div>
</section>

<!-- ================= SYSTEM MESSAGES ================= -->
<section class="max-w-7xl mx-auto px-6 mt-6">
    <div th:if="${message}"
         class="mb-4 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-green-700 text-sm font-medium">
        <p th:text="${message}"></p>
    </div>

    <div th:if="${error}"
         class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-red-700 text-sm font-medium">
        <p th:text="${error}"></p>
    </div>

    <div th:if="${errorMessage}" id="server-error-message" style="display:none" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" id="server-success-message" style="display:none" th:text="${successMessage}"></div>

    <script>
        const errEl = document.getElementById('server-error-message');
        if (errEl && errEl.textContent.trim()) {
            alert(errEl.textContent.trim());
        }
        const okEl = document.getElementById('server-success-message');
        if (okEl && okEl.textContent.trim()) {
            alert(okEl.textContent.trim());
        }
    </script>
</section>

<!-- ================= BOOKS BY CATEGORY ================= -->
<section id="categories" class="py-14">
    <div class="max-w-7xl mx-auto px-6">


        <div th:each="category : ${booksByCategory.keySet()}">
            <header class="mb-4">
                <h2 class="text-xl font-bold mb-1" th:text="${category}">Category Name</h2>
                <p class="text-slate-600 text-sm">Books in this category</p>
            </header>

            <div class="book-scroll-container">
                <div class="flex space-x-6 pb-4">
                    <article th:each="book : ${booksByCategory.get(category)}"
                             class="book-card-home">

                        <div class="w-full mb-4 relative book-cover-container">
                            <img th:if="${book.coverUrl != null}" th:src="${book.coverUrl}" alt="Book Cover"
                                 class="w-full h-full object-cover shadow-lg transform hover:scale-105 transition">
                            <img th:unless="${book.coverUrl != null}" th:src="@{/images/default-book.png}" alt="Default Cover"
                                 class="w-full h-full object-contain opacity-60 shadow-lg transform hover:scale-105 transition">
                        </div>

                        <div class="flex flex-col flex-1">
                            <h3 class="text-sm font-bold text-slate-900 mb-1 truncate" th:text="${book.title}"></h3>
                            <p class="text-xs text-slate-600 mb-2 truncate" th:text="${book.author}"></p>

                            <div class="flex flex-wrap items-center gap-1 mb-2">
                                <span class="inline-block text-xs font-medium bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full"
                                      th:text="${book.category}"></span>
                                <span class="text-xs text-slate-500" th:text="${book.publishYear}"></span>
                            </div>

                            <p class="text-xs text-slate-500 mb-4 truncate" th:text="${book.publisher}"></p>

                            <form th:if="${book.available}" th:action="@{/user/borrowRecord/add}" method="post">
                                <input type="hidden" name="bookId" th:value="${book.id}" />
                                <button type="submit"
                                        class="w-full text-xs font-semibold text-white bg-blue-600 py-2.5 rounded-full hover:bg-blue-700 transition">
                                    Book
                                </button>
                            </form>

                            <span th:if="${!book.available}"
                                  class="mt-auto w-full text-center text-xs font-semibold text-white bg-slate-400 py-2.5 rounded-full cursor-not-allowed">
                                Unavailable
                            </span>
                        </div>
                    </article>
                </div>
            </div>
        </div>
    </div>
</section>


<style>
/* ========== GLOBAL ========== */
* { box-sizing: border-box; }
/* ========== GLOBAL ========== */
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: #f9fafb;
}

/* ================= HEADER ================= */
.site-header {
    position: sticky;
    top: 0;
    background: white;
    box-shadow: 0 4px 12px rgba(0,0,0,.05);
    z-index: 50;
}

.header-container {
    max-width: 1400px;
    margin: auto;
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #2563eb;
    font-size: 1.6rem;
    font-weight: 800;
    text-decoration: none;
}

.icon-bar {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 1.5rem;
}

.icon-divider {
    width: 1px;
    height: 1.5rem;
    background: #ddd;
}

/* ================= BOOK SCROLL ================= */
.book-scroll-container {
    overflow-x: auto;
    scrollbar-width: none;
}
.book-scroll-container::-webkit-scrollbar { display: none; }

/* ================= BOOK CARD ================= */
.book-card-home {
    flex: 0 0 160px;
    max-width: 160px;

    background: white;
    box-shadow: rgb(0, 0, 0);

    padding: 0.7rem;
    display: flex;
    flex-direction: column;

    height: 400px;
    transition: .3s ease;
}

.book-card-home:hover {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 16px 30px rgba(0,0,0,.05);
}

/* ================= COVER ================= */
.book-cover-container {
    width: 100%;
    height: 250px;
    overflow: hidden;
    background: #e0e7ff;
    margin-bottom: 0.5rem;
}

.book-cover-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ================= TEXT ================= */
.book-card-home h3 {
    font-size: 0.8rem;
    font-weight: 700;
    line-height: 1.2;
}

.book-card-home p {
    font-size: 0.7rem;
    color: #64748b;
}

/* Keep cards equal height */
.book-card-home h3,
.book-card-home p {
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}
.logout-btn {
    display: flex; align-items: center; 
    gap: 0.5rem;
    background-color: #dc2626;
    color: white; 
    font-weight: 600;
    padding: 0.4rem 0.75rem;
    border-radius: 0.5rem; 
    border: none;
    cursor: pointer; 
    font-size: 0.875rem;
    transition: background-color 0.2s, transform 0.1s;
}

.logout-btn:hover {
  background-color: #b91c1c; 
  transform: translateY(-1px);
}
/* ================= BUTTON POSITION ================= */
.book-card-home .flex.flex-col {
    flex: 1;
    display: flex;
}

.book-card-home form,
.book-card-home span {
    margin-top: auto;
}

</style>
